name: Feature request
description: Suggest an addition or a change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or use case, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Including how React Flow or Svelte Flow handles it, if they do.
  - type: dropdown
    id: package
    attributes:
      label: Which package would it belong to?
      options:
        - "@xy-lit/store"
        - "@xy-lit/flow"
        - "@xy-lit/collab-yjs"
        - "@xy-lit/pro"
        - "@xy-lit/ui"
        - Not sure
