# The full gate (see CLAUDE.md §Commands) on all three browsers (Chromium, Firefox, WebKit).
# WebKit cannot run on every developer machine, so CI is where it is exercised: do not set
# XY_BROWSERS here. The last step fails if the run left the working tree dirty.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # the version comes from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install browsers (Chromium, Firefox, WebKit) and their system libraries
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm e2e
      - run: pnpm fuzz
        env:
          FUZZ_RUNS: '10000'
      - run: pnpm e2e:collab
      - run: pnpm perf
      - run: pnpm manifest
      - run: pnpm check:packages
      - run: pnpm --filter @xy-lit/storybook build
      - run: pnpm --filter @xy-lit/storybook test
      - run: pnpm --filter @xy-lit/docs build
      - run: pnpm --filter @xy-lit/docs test

      - name: The gate leaves the working tree clean
        run: git diff --exit-code && test -z "$(git status --porcelain)"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: |
            **/test-results
            **/playwright-report
          if-no-files-found: ignore
